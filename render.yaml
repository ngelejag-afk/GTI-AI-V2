services:
  - type: web
    name: gti-ai-v2-mt5-bridge
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bridge_service:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GTI_BRIDGE_SECRET
        sync: false
      - key: GTI_BRIDGE_MAX_AGE
        value: "120"
